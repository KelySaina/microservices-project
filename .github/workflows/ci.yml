name: CI/CD

on:
  push:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: kelysaina

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed_services: ${{ steps.changes.outputs.CHANGED_SERVICES }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate global version
        id: version
        run: |
          VERSION="v-$((RANDOM%9000+1000))"
          BUILD_DATE=$(date +%F)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
          echo "Generated global version: $VERSION, build date: $BUILD_DATE"

      - name: Determine changed services
        id: changes
        run: |
          git fetch --depth=2

          PREV_COMMIT=${{ github.event.before }}
          if [ -z "$PREV_COMMIT" ] || [ "$PREV_COMMIT" = "0000000000000000000000000000000000000000" ]; then
            PREV_COMMIT=$(git rev-parse HEAD~1)
          fi

          CHANGED_SERVICES=$(git diff --name-only "$PREV_COMMIT" HEAD \
            | grep -E '^services/' \
            | cut -d/ -f2 \
            | sort -u \
            | tr '\n' ' ')
          echo "Changed services: $CHANGED_SERVICES"
          echo "CHANGED_SERVICES=$CHANGED_SERVICES" >> $GITHUB_OUTPUT

      - name: Build and Push changed images
        run: |
          if [ -z "${{ steps.changes.outputs.CHANGED_SERVICES }}" ]; then
            echo "No services changed. Skipping build."
          else
            for service in ${{ steps.changes.outputs.CHANGED_SERVICES }}; do
              echo "Building and pushing $service"

              # Build with VERSION and BUILD_DATE as Docker build args
              docker build \
                --build-arg VERSION=$VERSION \
                --build-arg BUILD_DATE=$BUILD_DATE \
                -t $REGISTRY/$IMAGE_OWNER/$service:latest ./services/$service

              docker push $REGISTRY/$IMAGE_OWNER/$service:latest
            done
          fi

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Tests
        run: |
          npm test --prefix auth-service || true
          npm test --prefix order-service || true
          pytest product-service/tests || true

  deploy:
    runs-on: self-hosted
    needs: [build, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Namespace
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl get namespaces

      - name: Deploy Services
        run: kubectl apply -n microservices -f k8s/svcs/

      - name: Deploy HPAs
        run: kubectl apply -n microservices -f k8s/hpas/

      - name: Rollout changed services
        run: |
          for service in ${{ needs.build.outputs.changed_services }}; do
            echo "Restarting deployment for $service"
            kubectl rollout restart deployment/$service -n microservices
          done
