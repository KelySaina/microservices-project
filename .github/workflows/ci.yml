name: CI/CD

on:
  push:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: kelysaina
  NAMESPACE: microservices
  HEALTH_TIMEOUT: 120 # seconds

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed_services: ${{ steps.changes.outputs.CHANGED_SERVICES }}
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate global version
        id: version
        run: |
          VERSION="v-$((RANDOM%9000+1000))"
          BUILD_DATE=$(date +%F)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated global version: $VERSION, build date: $BUILD_DATE"

      - name: Determine changed services
        id: changes
        run: |
          git fetch --depth=2
          PREV_COMMIT=${{ github.event.before }}
          if [ -z "$PREV_COMMIT" ] || [ "$PREV_COMMIT" = "0000000000000000000000000000000000000000" ]; then
            PREV_COMMIT=$(git rev-parse HEAD~1)
          fi

          CHANGED_SERVICES=$(git diff --name-only "$PREV_COMMIT" HEAD \
            | grep -E '^services/' \
            | cut -d/ -f2 \
            | sort -u \
            | tr '\n' ' ')
          echo "Changed services: $CHANGED_SERVICES"
          echo "CHANGED_SERVICES=$CHANGED_SERVICES" >> $GITHUB_OUTPUT

      - name: Build and Push changed images
        run: |
          if [ -z "${{ steps.changes.outputs.CHANGED_SERVICES }}" ]; then
            echo "No services changed. Skipping build."
          else
            for service in ${{ steps.changes.outputs.CHANGED_SERVICES }}; do
              echo "Building and pushing $service:$VERSION"
              docker build \
                --build-arg VERSION=$VERSION \
                --build-arg BUILD_DATE=$BUILD_DATE \
                -t $REGISTRY/$IMAGE_OWNER/$service:$VERSION \
                -t $REGISTRY/$IMAGE_OWNER/$service:latest \
                ./services/$service

              docker push $REGISTRY/$IMAGE_OWNER/$service:$VERSION
              docker push $REGISTRY/$IMAGE_OWNER/$service:latest
            done
          fi

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull built images
        run: |
          for service in ${{ needs.build.outputs.changed_services }}; do
            echo "Pulling image for $service:$VERSION"
            docker pull $REGISTRY/$IMAGE_OWNER/$service:$VERSION || true
          done

      - name: Run auth-service unit tests inside image
        run: |
          docker run --rm $REGISTRY/$IMAGE_OWNER/auth-service:$VERSION npm test || true

      - name: Run order-service unit tests inside image
        run: |
          docker run --rm $REGISTRY/$IMAGE_OWNER/order-service:$VERSION npm test || true

      - name: Run product-service unit tests inside image
        run: |
          docker run --rm $REGISTRY/$IMAGE_OWNER/product-service:$VERSION pytest tests/ || true



  deploy:
    runs-on: self-hosted
    needs: [build, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        run: |
          kubectl version --client
          kubectl config get-contexts

      - name: Deploy Namespace
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl get namespaces

      - name: Deploy Base Manifests
        run: |
          kubectl apply -n $NAMESPACE -f k8s/svcs/
          kubectl apply -n $NAMESPACE -f k8s/hpas/

      - name: Deploy Changed Services with Version Tag
        run: |
          VERSION=${{ needs.build.outputs.version }}
          for service in ${{ needs.build.outputs.changed_services }}; do
            echo "🔹 Updating $service image to version $VERSION"
            kubectl set image deployment/$service \
              $service=$REGISTRY/$IMAGE_OWNER/$service:$VERSION \
              -n $NAMESPACE
          done

      - name: Wait and Validate Rollout
        run: |
          VERSION=${{ needs.build.outputs.version }}

          for service in ${{ needs.build.outputs.changed_services }}; do
            svc_name="${service%%-*}"
            echo "🚀 Waiting for rollout of $service..."
            if ! kubectl rollout status deployment/$service -n $NAMESPACE --timeout=90s; then
              echo "❌ Rollout failed for $service. Rolling back..."
              kubectl rollout undo deployment/$service -n $NAMESPACE
              exit 1
            fi

            echo "🩺 Checking health of $service (waiting for version change)..."
            URL="http://myapp.local:30080/$svc_name"
            OLD_VERSION=$(kubectl get deployment $service -n $NAMESPACE -o jsonpath='{.metadata.annotations.version}')
            ELAPSED=0
            while [ $ELAPSED -lt $HEALTH_TIMEOUT ]; do
              NEW_VERSION=$(curl -s -X POST "$URL" -H "Content-Type: application/json" \
                -d '{"query":"{ healthz }"}' | jq -r '.data.healthz' 2>/dev/null || echo "")

              if [ "$NEW_VERSION" = "$VERSION" ]; then
                echo "✅ $service successfully running version $VERSION"
                kubectl annotate deployment/$service version=$VERSION --overwrite -n $NAMESPACE
                break
              fi

              echo "⏳ Waiting ($ELAPSED s) for $service at $URL to update..."
              sleep 5
              ELAPSED=$((ELAPSED + 5))
            done

            if [ $ELAPSED -ge $HEALTH_TIMEOUT ]; then
              echo "⚠️ $service failed to report version change within timeout. Rolling back..."
              kubectl rollout undo deployment/$service -n $NAMESPACE
              exit 1
            fi
          done
