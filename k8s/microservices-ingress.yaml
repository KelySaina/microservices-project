apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microservices-ingress
  namespace: microservices
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /graphql
spec:
  rules:
    - host: myapp.local
      http:
        paths:
        - path: /auth
          pathType: Prefix
          backend:
            service:
              name: auth-service
              port:
                number: 4001
        - path: /orders
          pathType: Prefix
          backend:
            service:
              name: order-service
              port:
                number: 4002
        - path: /products
          pathType: Prefix
          backend:
            service:
              name: product-service
              port:
                number: 4003
