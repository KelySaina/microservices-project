apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microservices-ingress
  namespace: microservices
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /graphql
spec:
  rules:
    - host: myapp.local
      http:
        paths:
          # --- AUTH SERVICE ---
          - path: /auth(/|$)(?!healthz)
            pathType: ImplementationSpecific
            backend:
              service:
                name: auth-service
                port:
                  number: 4001
          - path: /auth/healthz
            pathType: ImplementationSpecific
            backend:
              service:
                name: auth-service
                port:
                  number: 4001

          # --- ORDER SERVICE ---
          - path: /orders(/|$)(?!healthz)
            pathType: ImplementationSpecific
            backend:
              service:
                name: order-service
                port:
                  number: 4002
          - path: /orders/healthz
            pathType: ImplementationSpecific
            backend:
              service:
                name: order-service
                port:
                  number: 4002

          # --- PRODUCT SERVICE ---
          - path: /products(/|$)(?!healthz)
            pathType: ImplementationSpecific
            backend:
              service:
                name: product-service
                port:
                  number: 4003
          - path: /products/healthz
            pathType: ImplementationSpecific
            backend:
              service:
                name: product-service
                port:
                  number: 4003
