version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: testdb
      MYSQL_USER: test
      MYSQL_PASSWORD: test
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 5s
      retries: 10
    networks:
      - lamp-network

  # Example: auth-service (repeat similarly for other services)
  auth-service:
    image: ghcr.io/kelysaina/auth-service:${VERSION} || ghcr.io/kelysaina/auth-service:latest
    environment:
      NODE_ENV: test
      DB_HOST: db
      DB_USER: test
      DB_PASSWORD: test
      DB_NAME: testdb
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4001:4001"
    networks:
      - lamp-network

  order-service:
    image: ghcr.io/kelysaina/order-service:${VERSION} || ghcr.io/kelysaina/order-service:latest
    environment:
      NODE_ENV: test
      DB_HOST: db
      DB_USER: test
      DB_PASSWORD: test
      DB_NAME: testdb
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4002:4002"
    networks:
      - lamp-network

  product-service:
    image: ghcr.io/kelysaina/product-service:${VERSION} || ghcr.io/kelysaina/product-service:latest
    environment:
      NODE_ENV: test
      DB_HOST: db
      DB_USER: test
      DB_PASSWORD: test
      DB_NAME: testdb
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4003:4003"
    networks:
      - lamp-network

networks:
  lamp-network:
    driver: bridge
